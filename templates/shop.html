{% extends "base.html" %}
{% load static %}

{% block content%}
<div class="container-fluid py-5 " style="margin-top: 10rem;">
    <div class="container">
        <div class="col-lg-12">
            {% if restaurants|length > 0 %}
            <div class="row g-5 justify-content-center">
                {% for restaurant in restaurants %}

                <div class="col-md-6 col-lg-6 col-xl-4">
                    <a href="{% url 'restaurant-detail' restaurant.id %}" style="text-decoration: none;">
                        <div class="rounded position-relative fruite-item">
                            <div class="fruite-img">
                                <img src="{{restaurant.profile_pic.url}}" class="img-fluid w-100 rounded-top" alt=""
                                    style="height: 300px;">
                            </div>
                            <div class="text-white bg-secondary px-3 py-1 rounded position-absolute"
                                style="top: 10px; left: 10px;">{{restaurant.type}}</div>
                            <div class="p-4 border border-secondary border-top-0 rounded-bottom">
                                <div class="d-flex justify-content-between">
                                    <h4>{{restaurant.name}}</h4>
                                    <p class="text-dark">Tvm</p>
                                </div>
                                <p>{{restaurant.description}}</p>
                            </div>
                        </div>
                    </a>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="d-flex flex-column align-items-center">
                <h1>NO RESTAURANTS</h1>
                <img src="{% static 'img/notfound.jpg'%}" class="w-100" style="object-fit: contain; height: 500px;" alt="Contained Image">
            </div>
            {% endif %}
        </div>
    </div>
</div>


{% endblock%}
